[project]
name = "astra-tools"
version = "0.1.0"
description = "Accelerator physics pre/post-processing toolkit for ASTRA & Generator (Jupyter-first)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Yuxin Wu"}]
keywords = ["accelerator", "physics", "particle-beam", "phase-space", "astra", "generator", "emittance", "field-map"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
jupyter = ["jupyter>=1.0.0", "ipykernel>=6.0.0", "ipympl>=0.9.0"]
ocelot = ["ocelot>=0.3.0"]
# LUME ecosystem (recommended base layer; conda-forge or git installs):
#   pip install git+https://github.com/ChristopherMayes/lume-astra
#   pip install git+https://github.com/ColwynGulliford/distgen
#   pip install beamphysics
lume = [
    "beamphysics>=0.16.0",
    "lume-base>=0.1.0",
    "pint>=0.20",
    "lume-astra @ git+https://github.com/ChristopherMayes/lume-astra",
    "distgen @ git+https://github.com/ColwynGulliford/distgen",
]

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "requires_astra: marks tests that need the ASTRA/Generator binaries",
]
