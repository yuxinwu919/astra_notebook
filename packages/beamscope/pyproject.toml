[project]
name = "beamscope"
version = "0.2.0"
description = "Accelerator particle distribution visualization toolkit — refactored with verified physics formulae"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Yuxin Wu"},
]
keywords = ["accelerator", "physics", "particle-beam", "phase-space", "astra", "visualization", "emittance", "bff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
gui = [
    "PySide6>=6.5.0",
    "ipywidgets>=7.5.0",
    "jupyter>=1.0.0",
]
ocelot = [
    "ocelot>=0.3.0",
]

[project.scripts]
beamscope = "beamscope.cli.main:main"

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100
